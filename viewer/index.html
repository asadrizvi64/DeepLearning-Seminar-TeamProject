<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>volsplat viewer</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;color:#cfd2dc;font:14px/1.5 system-ui,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0}
  #ui{position:fixed;left:12px;top:12px;z-index:10;background:rgba(20,20,28,.82);
      padding:12px 14px;border:1px solid #2a2a38;border-radius:10px;max-width:320px}
  h1{font-size:15px;margin:0 0 8px;font-weight:600}
  .row{margin:8px 0}
  input[type=range]{width:100%}
  label{font-size:12px;color:#9aa0b4}
  .hint{font-size:12px;color:#8a8fa3;margin-top:8px}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
        background:rgba(10,10,16,.7);font-size:18px;z-index:20}
  code{background:#1a1a24;padding:1px 5px;border-radius:4px;color:#b9bed0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <h1>volsplat &mdash; splat viewer</h1>
  <div class="row">
    <input id="file" type="file" accept=".splat" multiple/>
    <div class="hint">Load one <code>.splat</code>, or several frames (named
      t000.splat, t001.splat&hellip;) for 3D+t scrubbing. Frames switch discretely;
      there is no interpolation between them.</div>
  </div>
  <div class="row" id="frameRow" style="display:none">
    <label>frame <span id="frameLbl">0</span></label>
    <input id="frame" type="range" min="0" max="0" value="0" step="1"/>
  </div>
  <div class="row">
    <label>point size <span id="szLbl">1.0</span></label>
    <input id="size" type="range" min="0.2" max="5" value="1" step="0.1"/>
  </div>
  <div class="row">
    <label>hide splats fainter than <span id="thrLbl">0.00</span></label>
    <input id="thr" type="range" min="0" max="0.9" value="0" step="0.01"/>
  </div>
  <div class="hint" id="stat">Drag a .splat here, or use the picker. Drag to orbit, scroll to zoom.</div>
</div>
<div id="drop">Drop .splat file(s)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const SP = 32; // bytes per splat: pos[3]f32, scale[3]f32, rgba[4]u8, rot[4]u8
let renderer, scene, camera, controls, cloud = null;
let frames = [];          // [{name, geometry}]
let curFrame = 0, ptSize = 1.0, minAlpha = 0.0;

function init(){
  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.01, 100);
  camera.position.set(2.2, 1.4, 2.2);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  animate();
}

// circular sprite so points look like soft splats
function sprite(){
  const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d').createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
  const ctx=cv.getContext('2d'); ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
  const t=new THREE.Texture(cv); t.needsUpdate=true; return t;
}
const TEX = null;

// Vertex shader: per-Gaussian point size from scale attribute
const _VS = `
  attribute float splatSize;
  attribute vec4 splatColor;
  varying vec4 vCol;
  uniform float uScale;
  void main(){
    vCol = splatColor;
    vec4 mv = modelViewMatrix * vec4(position,1.0);
    // world-space scale → screen pixels, min 3px so tiny Gaussians stay visible,
    // max 96px so a few very broad background Gaussians do not cover the view
    gl_PointSize = clamp(splatSize * uScale * 400.0 / -mv.z, 3.0, 96.0);
    gl_Position = projectionMatrix * mv;
  }
`;
// Fragment shader: Gaussian radial falloff → soft blob, not hard circle
const _FS = `
  varying vec4 vCol;
  uniform float uMinAlpha;
  void main(){
    float d = length(gl_PointCoord - vec2(0.5));
    if(d > 0.5 || vCol.a < uMinAlpha) discard;   // hide faint (background) splats
    float alpha = exp(-d*d*10.0) * vCol.a * 2.5;  // *2.5 brightens faint grayscale
    gl_FragColor = vec4(vCol.rgb * 1.8, alpha);    // boost grey nuclei on dark bg
  }
`;

// zScale stretches z for display (anisotropic voxels: z step / xy pixel size)
function parseSplat(buf, zScale){
  const n = Math.floor(buf.byteLength / SP);
  const dv = new DataView(buf);
  const pos = new Float32Array(n*3);
  const col = new Float32Array(n*4);   // rgba
  const sz  = new Float32Array(n);     // scale magnitude per Gaussian
  for(let i=0;i<n;i++){
    const o=i*SP;
    pos[i*3]=dv.getFloat32(o,true); pos[i*3+1]=dv.getFloat32(o+4,true);
    pos[i*3+2]=dv.getFloat32(o+8,true)*zScale;
    // bytes 12-23: 3×float32 scale — use RMS magnitude
    const sx=dv.getFloat32(o+12,true), sy=dv.getFloat32(o+16,true), scz=dv.getFloat32(o+20,true)*zScale;
    sz[i] = Math.sqrt((sx*sx+sy*sy+scz*scz)/3);
    // bytes 24-27: rgba uint8
    col[i*4  ]=dv.getUint8(o+24)/255;
    col[i*4+1]=dv.getUint8(o+25)/255;
    col[i*4+2]=dv.getUint8(o+26)/255;
    col[i*4+3]=dv.getUint8(o+27)/255;
  }
  return {n, pos, col, sz};
}

// One centre and radius for all frames, so motion between frames is not normalised away
function toGeometries(parsed){
  let cx=0,cy=0,cz=0,m=0;
  for(const p of parsed) for(let i=0;i<p.n;i++){cx+=p.pos[i*3]; cy+=p.pos[i*3+1]; cz+=p.pos[i*3+2]; m++;}
  cx/=m; cy/=m; cz/=m;
  let r=0;
  for(const p of parsed) for(let i=0;i<p.n;i++)
    r=Math.max(r,Math.hypot(p.pos[i*3]-cx,p.pos[i*3+1]-cy,p.pos[i*3+2]-cz));
  r=r||1;
  return parsed.map(p=>{
    for(let i=0;i<p.n;i++){
      p.pos[i*3]=(p.pos[i*3]-cx)/r; p.pos[i*3+1]=(p.pos[i*3+1]-cy)/r; p.pos[i*3+2]=(p.pos[i*3+2]-cz)/r;
      p.sz[i]/=r;   // scale to same world-unit space as positions
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',  new THREE.BufferAttribute(p.pos,3));
    geo.setAttribute('splatColor',new THREE.BufferAttribute(p.col,4));
    geo.setAttribute('splatSize', new THREE.BufferAttribute(p.sz,1));
    geo.userData.count=p.n;
    return geo;
  });
}

function showFrame(i){
  if(!frames.length) return;
  curFrame=Math.max(0,Math.min(frames.length-1,i));
  if(cloud) scene.remove(cloud);
  const mat=new THREE.ShaderMaterial({
    uniforms:{uScale:{value:ptSize}, uMinAlpha:{value:minAlpha}},
    vertexShader:_VS, fragmentShader:_FS,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  cloud=new THREE.Points(frames[curFrame].geometry,mat);
  scene.add(cloud);
  document.getElementById('frameLbl').textContent=curFrame;
  document.getElementById('stat').textContent=
    `${frames[curFrame].name}: ${frames[curFrame].geometry.userData.count.toLocaleString()} splats`;
}

const params = new URLSearchParams(location.search);
const zScale = parseFloat(params.get('zscale')) || 1.0;
// start from the URL (or defaults), not from slider values the browser restored
minAlpha = parseFloat(params.get('thr')) || 0.0;
ptSize = parseFloat(params.get('size')) || 1.0;
document.getElementById('thr').value = minAlpha;
document.getElementById('thrLbl').textContent = minAlpha.toFixed(2);
document.getElementById('size').value = ptSize;
document.getElementById('szLbl').textContent = ptSize.toFixed(1);

async function loadFiles(fileList){
  const files = [...fileList].filter(f=>f.name.endsWith('.splat')).sort((a,b)=>a.name.localeCompare(b.name));
  if(!files.length) return;
  const bufs = [];
  for(const f of files) bufs.push(await f.arrayBuffer());
  showLoaded(files.map(f=>f.name), bufs);
}

// ?files=a.splat,b.splat&zscale=4.33 loads files served next to this page
async function loadUrls(urls){
  const bufs = await Promise.all(urls.map(u=>fetch(u).then(r=>{
    if(!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.arrayBuffer(); })));
  showLoaded(urls.map(u=>u.split('/').pop()), bufs);
}

function showLoaded(names, bufs){
  const geos = toGeometries(bufs.map(b=>parseSplat(b, zScale)));
  frames = names.map((name,i)=>({name, geometry:geos[i]}));
  const fr = document.getElementById('frame');
  fr.max = frames.length-1; fr.value = 0;
  document.getElementById('frameRow').style.display = frames.length>1 ? 'block':'none';
  showFrame(0);
  // frame the camera
  controls.target.set(0,0,0); camera.position.set(2.2,1.4,2.2); controls.update();
}

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }

document.getElementById('file').addEventListener('change', e=>loadFiles(e.target.files));
document.getElementById('frame').addEventListener('input', e=>showFrame(+e.target.value));
document.getElementById('size').addEventListener('input', e=>{
  ptSize=+e.target.value; document.getElementById('szLbl').textContent=ptSize.toFixed(1); showFrame(curFrame); });
document.getElementById('thr').addEventListener('input', e=>{
  minAlpha=+e.target.value; document.getElementById('thrLbl').textContent=minAlpha.toFixed(2); showFrame(curFrame); });
const drop=document.getElementById('drop');
addEventListener('dragover', e=>{e.preventDefault(); drop.style.display='flex';});
drop.addEventListener('dragleave', ()=>drop.style.display='none');
addEventListener('drop', e=>{e.preventDefault(); drop.style.display='none'; loadFiles(e.dataTransfer.files);});

init();
if(params.get('files')){
  loadUrls(params.get('files').split(',')).catch(e=>{
    document.getElementById('stat').textContent = 'Could not load: ' + e.message; });
}
</script>
</body>
</html>
